<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RANKED STUDIO - Video Export</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #07060b;
  color: #f3f0fa;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  font-size: 25px;
  color: #c084fc;
}

.container {
  max-width: 500px;
  margin: auto;
}

canvas {
  width: 180px;
  max-width: 100%;
  border: 2px solid #8b5cf6;
  border-radius: 15px;
  background: #12091f;
}

button {
  background: #8b5cf6;
  color: white;
  border: 0;
  padding: 12px 18px;
  margin: 6px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

input {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 10px;
  background: #171321;
  color: white;
  border: 1px solid #8b5cf6;
  border-radius: 8px;
}

#status {
  color: #c084fc;
  overflow-wrap: anywhere;
}

#progress {
  width: 100%;
  height: 8px;
  accent-color: #a855f7;
}

.info {
  background: #171321;
  border-radius: 12px;
  padding: 15px;
  margin: 15px 0;
  font-size: 14px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>RANKED STUDIO</h1>
<p>Browser Video Export</p>

<div class="info">
  Resolution: 360 × 640<br>
  Frame rate: 15 FPS<br>
  Duration: 15 seconds<br>
  Format: WebM (browser-supported)
</div>

<canvas id="canvas" width="360" height="640"></canvas>

<h3>Ranking images</h3>
<input type="file" id="images" accept="image/*" multiple>

<p id="status">Choose up to 5 images to begin.</p>

<progress id="progress" value="0" max="100"></progress>

<br>

<button id="preview">Preview</button>
<button id="export">Render & Download Video</button>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
  alpha: false
});

const imageInput = document.getElementById("images");
const exportBtn = document.getElementById("export");
const previewBtn = document.getElementById("preview");
const status = document.getElementById("status");
const progress = document.getElementById("progress");

let images = [];
let running = false;
let previewing = false;
let previewStart = 0;
let rafId = 0;

const FPS = 15;
const DURATION = 15;
const SCENE_DURATION = 3;

imageInput.addEventListener("change", async () => {
  images = [];

  const files = Array.from(imageInput.files)
    .filter(file => file.type.startsWith("image/"))
    .slice(0, 5);

  if (!files.length) {
    status.textContent = "Please select image files.";
    return;
  }

  status.textContent = "Loading images...";

  try {
    for (const file of files) {
      const url = URL.createObjectURL(file);

      try {
        const img = new Image();

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = url;
        });

        images.push(img);
      } finally {
        // Keep the URL alive while its image is in use.
        // It will be released when replaced or the page closes.
      }
    }

    status.textContent =
      images.length + " images loaded successfully.";

    drawScene(0);
  } catch (error) {
    status.textContent = "Could not load an image.";
  }
});

function drawScene(seconds) {
  const index = Math.min(
    images.length - 1,
    Math.floor(seconds / SCENE_DURATION)
  );

  const rank = 5 - index;

  // Background
  const gradient = ctx.createLinearGradient(0, 0, 360, 640);
  gradient.addColorStop(0, "#35115f");
  gradient.addColorStop(1, "#08060d");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 360, 640);

  // Header
  ctx.textAlign = "center";
  ctx.fillStyle = "#d8b4fe";
  ctx.font = "bold 23px Arial";
  ctx.fillText("TOP 5 RANKING", 180, 65);

  // Rank number
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 100px Arial";
  ctx.fillText("#" + rank, 180, 190);

  // Image
  const img = images[index];

  if (img) {
    const boxX = 25;
    const boxY = 220;
    const boxW = 310;
    const boxH = 300;

    const scale = Math.max(
      boxW / img.width,
      boxH / img.height
    );

    const width = img.width * scale;
    const height = img.height * scale;

    ctx.save();
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxW, boxH, 18);
    ctx.clip();

    ctx.drawImage(
      img,
      boxX + (boxW - width) / 2,
      boxY + (boxH - height) / 2,
      width,
      height
    );

    ctx.restore();
  } else {
    ctx.fillStyle = "#241638";
    ctx.fillRect(25, 220, 310, 300);

    ctx.fillStyle = "#c084fc";
    ctx.font = "24px Arial";
    ctx.fillText("Upload your images", 180, 370);
  }

  // Footer
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 21px Arial";
  ctx.fillText("RANKED STUDIO", 180, 570);

  ctx.fillStyle = "#c084fc";
  ctx.font = "16px Arial";
  ctx.fillText("Ranking Video", 180, 600);
}

function previewFrame(timestamp) {
  if (!previewing) return;

  const seconds = ((timestamp - previewStart) / 1000) % DURATION;

  drawScene(seconds);

  rafId = requestAnimationFrame(previewFrame);
}

previewBtn.addEventListener("click", () => {
  if (previewing) {
    previewing = false;
    cancelAnimationFrame(rafId);
    previewBtn.textContent = "Preview";
    return;
  }

  previewing = true;
  previewStart = performance.now();

  previewBtn.textContent = "Stop Preview";

  rafId = requestAnimationFrame(previewFrame);
});

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

exportBtn.addEventListener("click", async () => {
  if (running) return;

  if (!images.length) {
    status.textContent = "Upload at least one image first.";
    return;
  }

  if (!canvas.captureStream || !window.MediaRecorder) {
    status.textContent =
      "This browser does not support canvas video recording.";
    return;
  }

  if (previewing) {
    previewing = false;
    cancelAnimationFrame(rafId);
    previewBtn.textContent = "Preview";
  }

  running = true;
  exportBtn.disabled = true;
  previewBtn.disabled = true;
  progress.value = 0;

  let stream;
  let recorder;
  let chunks = [];
  let frameTimer;

  try {
    drawScene(0);

    stream = canvas.captureStream(FPS);

    const mimeType = [
      "video/webm;codecs=vp8",
      "video/webm"
    ].find(type => MediaRecorder.isTypeSupported(type));

    if (!mimeType) {
      throw new Error("WebM recording is not supported.");
    }

    recorder = new MediaRecorder(stream, {
      mimeType,
      videoBitsPerSecond: 800000
    });

    recorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) {
        chunks.push(event.data);
      }
    };

    const stopped = new Promise((resolve, reject) => {
      recorder.onstop = resolve;

      recorder.onerror = event => {
        reject(
          event.error || new Error("Browser recording failed.")
        );
      };
    });

    recorder.start(1000);

    const start = performance.now();

    status.textContent = "Rendering video...";

    // Render frames at 15 FPS.
    frameTimer = setInterval(() => {
      const elapsed = performance.now() - start;
      const seconds = Math.min(elapsed / 1000, DURATION);

      drawScene(seconds);

      progress.value = Math.min(
        100,
        (elapsed / (DURATION * 1000)) * 100
      );

      status.textContent =
        "Rendering... " +
        Math.floor(progress.value) + "%";

      if (elapsed >= DURATION * 1000) {
        clearInterval(frameTimer);
        frameTimer = null;

        if (recorder.state !== "inactive") {
          recorder.stop();
        }
      }
    }, 1000 / FPS);

    await stopped;

    const blob = new Blob(chunks, {
      type: mimeType
    });

    if (!blob.size) {
      throw new Error("The exported video is empty.");
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "ranked-studio-video.webm";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 60000);

    progress.value = 100;
    status.textContent =
      "Video exported successfully! File size: " +
      (blob.size / 1048576).toFixed(2) + " MB";

  } catch (error) {
    status.textContent =
      "Export failed: " + (error.message || "Recording error");
  } finally {
    if (frameTimer) clearInterval(frameTimer);

    if (recorder && recorder.state !== "inactive") {
      try {
        recorder.stop();
      } catch (e) {}
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    running = false;
    exportBtn.disabled = false;
    previewBtn.disabled = false;
  }
});

// Show a starter scene.
drawScene(0);
</script>

</body>
</html>
